{% extends "base.html" %}
{% block title %}Регистрация — Мини-SaaS для опросов{% endblock %}
{% block content %}
<div class="card">
    <h1>Регистрация</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" minlength="6" required>
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" name="password2" minlength="6" required>
        <button type="submit">Создать аккаунт</button>
    </form>
    <p class="muted links">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
