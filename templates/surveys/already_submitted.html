{% extends "base.html" %}

{% block title %}Вы уже прошли опрос{% endblock %}

{% block content %}
<div class="card" style="text-align:center;padding:40px;">
    <h1 style="color:#2c7be5;">Вы уже прошли этот опрос</h1>
    <p style="font-size:18px;color:#666;margin:20px 0;">
        Спасибо! Ваши ответы уже сохранены — повторная отправка не требуется.
    </p>
    {% if survey %}
    <p style="color:#888;">Опрос: <strong>{{ survey.title }}</strong></p>
    {% endif %}
    <div style="margin-top:30px;">
        <a href="/" class="btn btn-primary">На главную</a>
    </div>
</div>
{% endblock %}
